name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x86_64, msystem: UCRT64,     prefix: mingw-w64-ucrt-x86_64 }
          - { runner: windows-11-arm, arch: arm64,  msystem: CLANGARM64, prefix: mingw-w64-clang-aarch64 }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            git zip
            ${{ matrix.prefix }}-cc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-sdl3
            ${{ matrix.prefix }}-curl
            ${{ matrix.prefix }}-zlib

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Verify
        run: |
          test -f build/dxm.exe
          echo "built dxm.exe"

      # The DLLs the binary actually loaded, rather than a guessed list - the
      # toolchain's runtime differs between UCRT64 and CLANGARM64.
      - name: Package
        run: |
          set -x
          mkdir -p dist/dxm
          cp build/dxm.exe dist/dxm/
          # Copy the DLLs the binary actually loaded, following dependencies
          # of dependencies - SDL3 pulls in more than dxm.exe names directly.
          # Only the ones from the MSYS2 prefix: system DLLs stay put.
          # Collect first, then act.  Written as a pipeline whose last stage
          # is grep, the recursion died the moment it reached a leaf DLL with
          # no MSYS2 dependencies: grep matching nothing returns 1, and under
          # set -e that ends the step.  The arm64 leg only survived because
          # its dependency chain happened to bottom out elsewhere.
          copy_deps() {
            local deps dll base
            deps=$(ldd "$1" | awk '{print $3}' \
                   | grep -iE "/(ucrt64|clangarm64|clang64|mingw64)/" || true)
            for dll in $deps; do
              base=$(basename "$dll")
              if [ ! -f "dist/dxm/$base" ]; then
                cp "$dll" dist/dxm/
                copy_deps "$dll"
              fi
            done
            return 0
          }
          copy_deps build/dxm.exe
          ls -la dist/dxm/
          cd dist && zip -r "../dxm-windows-${{ matrix.arch }}.zip" dxm

      - uses: actions/upload-artifact@v4
        with:
          name: dxm-windows-${{ matrix.arch }}
          path: dxm-windows-${{ matrix.arch }}.zip
