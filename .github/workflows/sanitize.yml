# Not a build: a test run, and not a test OF a platform.  The three
# platform workflows produce the release binaries and never execute them.
# This one builds the machine with AddressSanitizer and
# UndefinedBehaviorSanitizer and actually RUNS it - the unit tests, a boot
# of the whole machine with the DOSBox core it builds alongside (the POST,
# the handover, a DOS command, EXIT), and the golden frames.
#
# What it checks is the C, which is the same code everywhere: a buffer
# overrun or an undefined operation found here is one on every platform.
# The eight preprocessor branches that differ per platform are the only
# thing outside its reach.  It happens to run on a Linux runner because
# that is the only one where the machine can be driven headless - Xvfb for
# a display, Mesa's llvmpipe for an OpenGL 3.3 driver in software - and
# because the sanitizers are best supported there.  That is a detail of
# where it runs, not of what it covers.
#
# It exists because of the signed overflow that hung two platforms on the
# splash for a week while every CI job was green: they had compiled it,
# nobody had run it.  UBSan aborts on that overflow at the line.
name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_references:
        description: >-
          Re-capture this runner's golden frames instead of comparing them,
          and commit them. For a deliberate visual change: look at the frames
          in the run's diff before you do this, because it blesses whatever
          the machine now draws.
        type: boolean
        default: false

# The button below commits the frames it captures.
permissions:
  contents: write

jobs:
  sanitize:
    name: ASan + UBSan, headless
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git \
            libgl1-mesa-dev libgl1-mesa-dri \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libwayland-dev libxkbcommon-dev libasound2-dev \
            libpulse-dev xvfb

      - name: Cache SDL3
        id: sdl3-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3-install
          key: sdl3-3.2.4-ubuntu22.04-x86_64-v1

      - name: Build SDL3
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.2.4 https://github.com/libsdl-org/SDL sdl3-src
          cmake -S sdl3-src -B sdl3-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-install" \
                -DSDL_STATIC=OFF
          cmake --build sdl3-build
          cmake --install sdl3-build

      # The core is the slow part of the build and changes only when the
      # submodule moves: its objects are kept per pinned commit, and touched
      # after the restore so make trusts them over the fresh checkout.
      - name: Core commit
        id: core
        run: echo "sha=$(git rev-parse HEAD:external/dosbox-pure)" >> "$GITHUB_OUTPUT"

      - name: Cache the core's objects
        uses: actions/cache@v4
        with:
          path: external/dosbox-pure/build
          key: core-sanitize-x86_64-${{ steps.core.outputs.sha }}-v1

      - name: Trust the cached objects
        run: |
          if [ -d external/dosbox-pure/build ]; then
            find external/dosbox-pure/build -type f -exec touch {} +
          fi

      - name: Build (Debug, ASan + UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDXM_SANITIZE=ON -DDXM_WERROR=ON \
                -DCMAKE_PREFIX_PATH="$HOME/sdl3-install"
          cmake --build build -j$(nproc)

      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build -L unit --output-on-failure

      # The whole machine, once: the core boots, DOSBox takes the tube, MEM
      # runs and EXIT powers it off (tests/boot/run.py).  The core itself is
      # not sanitized; everything of DXM's that talks to it is.
      - name: Boot
        env:
          ASAN_OPTIONS: detect_leaks=0
          LIBGL_ALWAYS_SOFTWARE: 1
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build -L boot --output-on-failure

      # Golden frames.  A reference set belongs to the renderer that drew
      # it - llvmpipe here, a real GPU on a developer's machine - which is
      # why they live in one directory per runner.  Compare when this
      # runner's set exists; otherwise capture it and upload it for review.
      # Compare, unless there is nothing to compare against or the run was
      # started with update_references, which re-captures instead.
      - name: Golden frames
        env:
          ASAN_OPTIONS: detect_leaks=0
          LIBGL_ALWAYS_SOFTWARE: 1
          SDL_VIDEODRIVER: x11
          UPDATE: ${{ inputs.update_references }}
        run: |
          mode=--compare
          if [ "$UPDATE" = "true" ]; then
            echo "update_references: re-capturing this runner's frames"
            mode=--update
          elif ! ls tests/golden/references/llvmpipe/*.png >/dev/null 2>&1; then
            # Never bless frames on its own.  A missing set means the test
            # has nothing to check, and a job that passes while checking
            # nothing is worse than one that fails.
            echo "no references for this runner: nothing to compare against." >&2
            echo "Run this workflow by hand with update_references ticked" >&2
            echo "to capture them, after looking at what it draws." >&2
            exit 1
          fi
          if [ "$mode" = "--update" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              python3 tests/golden/run.py build/dxm --refs llvmpipe --update --out build/golden
          else
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              python3 tests/golden/run.py build/dxm --refs llvmpipe --out build/golden
          fi

      # The point of the button: the new frames land on the branch, so every
      # run after this one compares against them.  A run that changed nothing
      # commits nothing.  GitHub does not start workflows for a push made
      # with GITHUB_TOKEN, so this commit lands quietly and the next ordinary
      # push is what re-runs the comparison.
      - name: Commit the re-captured references
        if: inputs.update_references
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/references/llvmpipe
          if git diff --cached --quiet; then
            echo "the frames are unchanged: nothing to commit"
            exit 0
          fi
          git commit -m "test: re-capture the llvmpipe golden references" \
                     -m "Captured by the Sanitizers workflow on ${GITHUB_SHA::7}."
          git push origin HEAD:${GITHUB_REF_NAME}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-llvmpipe
          path: |
            tests/golden/references/llvmpipe/
            build/golden/
          if-no-files-found: ignore
