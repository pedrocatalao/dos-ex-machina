name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write        # needed to attach assets on release events

jobs:
  build:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Homebrew's SDL3 is arm64-only, so it cannot link a universal binary.
      # Build it from source for both architectures instead, and cache it -
      # SDL is the slow part here, not DXM.  curl and zlib come from the SDK
      # and are already universal.
      - name: Cache SDL3
        id: sdl3-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3-install
          key: sdl3-3.2.4-macos-universal-v1

      - name: Build SDL3 (universal)
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.2.4 https://github.com/libsdl-org/SDL sdl3-src
          cmake -S sdl3-src -B sdl3-build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-install" \
                -DSDL_STATIC=OFF
          cmake --build sdl3-build -j3
          cmake --install sdl3-build

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_PREFIX_PATH="$HOME/sdl3-install"
          cmake --build build -j3

      - name: Verify
        run: |
          lipo -archs build/dxm | grep -q "x86_64 arm64"
          otool -L build/dxm | grep -q SDL3
          echo "universal, links SDL3"

      # A .app, not a bare binary.  Two reasons: a folder of loose files is
      # not how anyone expects to be handed a Mac program, and Gatekeeper's
      # right-click -> Open escape hatch only exists for bundles - on a bare
      # executable the user has to know about xattr.
      - name: Package (.app)
        run: |
          APP="dist/DOS ex Machina.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" \
                   "$APP/Contents/Resources"
          cp packaging/macos/Info.plist "$APP/Contents/"
          ./tools/make_icns.sh assets/icon-src.png "$APP/Contents/Resources/dxm.icns"
          cp build/dxm "$APP/Contents/MacOS/"
          # SDL3 travels with it - it is built from source here, so a user
          # would have nowhere to get it.  curl, zlib and OpenGL are system
          # libraries and must stay that way.
          cp -L "$HOME"/sdl3-install/lib/libSDL3*.dylib "$APP/Contents/Frameworks/"
          chmod u+w "$APP/Contents/Frameworks/"*.dylib
          for dylib in "$APP/Contents/Frameworks/"*.dylib; do
            install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib"
          done
          # A CMake-built SDL3 already reports @rpath; a Homebrew one would
          # give an absolute path.  Rewrite only what needs it.
          for lib in $(otool -L "$APP/Contents/MacOS/dxm" | awk 'NR>1 && $1 ~ /SDL3/ {print $1}'); do
            case "$lib" in @rpath/*) continue ;; esac
            install_name_tool -change "$lib" "@rpath/$(basename "$lib")" \
                              "$APP/Contents/MacOS/dxm"
          done
          # install_name_tool invalidates the signature, and on Apple Silicon
          # an unsigned binary will not launch at all.  Ad-hoc is enough to
          # load; it is NOT notarisation, so a download is still quarantined.
          codesign --force --sign - "$APP/Contents/Frameworks/"*.dylib
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          otool -L "$APP/Contents/MacOS/dxm" | grep -i sdl3
          if otool -L "$APP/Contents/MacOS/dxm" | grep -q "$HOME/sdl3-install"; then
            echo "still references the build tree"; exit 1
          fi
          # -y keeps the symlinks a bundle relies on
          cd dist && zip -r -y ../dxm-macos-universal.zip "DOS ex Machina.app"

      - uses: actions/upload-artifact@v4
        with:
          name: dxm-macos-universal
          path: dxm-macos-universal.zip
