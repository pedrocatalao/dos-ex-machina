name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write        # needed to attach assets on release events

jobs:
  build:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Homebrew's SDL3 is arm64-only, so it cannot link a universal binary.
      # Build it from source for both architectures instead, and cache it -
      # SDL is the slow part here, not DXM.  curl and zlib come from the SDK
      # and are already universal.
      - name: Cache SDL3
        id: sdl3-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3-install
          key: sdl3-3.2.4-macos-universal-v1

      - name: Build SDL3 (universal)
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.2.4 https://github.com/libsdl-org/SDL sdl3-src
          cmake -S sdl3-src -B sdl3-build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-install" \
                -DSDL_STATIC=OFF
          cmake --build sdl3-build -j3
          cmake --install sdl3-build

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_PREFIX_PATH="$HOME/sdl3-install"
          cmake --build build -j3

      - name: Verify
        run: |
          lipo -archs build/dxm | grep -q "x86_64 arm64"
          otool -L build/dxm | grep -q SDL3
          echo "universal, links SDL3"

      # A zip someone can unpack and run.  SDL3 travels with it - it is built
      # from source here, so a user would have nowhere to get it from - while
      # curl, zlib and OpenGL come from the system, as they must.
      - name: Package
        run: |
          mkdir -p dist/dxm/lib
          cp build/dxm dist/dxm/
          for lib in $(otool -L build/dxm | awk 'NR>1 && $1 ~ /SDL3/ {print $1}'); do
            [ -f "$lib" ] || continue
            base=$(basename "$lib")
            cp -L "$lib" dist/dxm/lib/
            chmod u+w "dist/dxm/lib/$base"
            install_name_tool -id "@rpath/$base" "dist/dxm/lib/$base"
            install_name_tool -change "$lib" "@rpath/$base" dist/dxm/dxm
          done
          # install_name_tool invalidates the code signature, and on Apple
          # Silicon an unsigned binary will not launch at all.  Ad-hoc signing
          # is enough - this is not notarisation, just a valid signature.
          codesign --force --sign - dist/dxm/lib/*.dylib
          codesign --force --sign - dist/dxm/dxm
          # Nothing may still point at the build-time SDL3, or the zip only
          # works on a machine that already had it.
          otool -L dist/dxm/dxm | grep -i sdl3
          if otool -L dist/dxm/dxm | grep -q "$HOME/sdl3-install"; then
            echo "still references the build tree"; exit 1
          fi
          cd dist && zip -r -y "../dxm-macos-universal.zip" dxm

      - uses: actions/upload-artifact@v4
        with:
          name: dxm-macos-universal
          path: dxm-macos-universal.zip
