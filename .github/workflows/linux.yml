name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false     # one arch failing must not cancel the other
      matrix:
        # Built on 22.04, not latest.  A glibc binary runs on the version it
        # was built against or newer and never older, so building on 24.04
        # (glibc 2.39) shipped something that would not start on 22.04 or
        # Debian 12.  22.04 is glibc 2.35, which covers everything current.
        include:
          - { runner: ubuntu-22.04,     arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # SDL3 is not in Ubuntu 24.04's archive yet, so it is built from
      # source and cached - the build itself is the slow part, not DXM.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git \
            libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libwayland-dev libxkbcommon-dev libasound2-dev \
            libpulse-dev

      - name: Cache SDL3
        id: sdl3-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3-install
          key: sdl3-3.2.4-ubuntu22.04-${{ matrix.arch }}-v1

      - name: Build SDL3
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.2.4 https://github.com/libsdl-org/SDL sdl3-src
          cmake -S sdl3-src -B sdl3-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-install" \
                -DSDL_STATIC=OFF
          cmake --build sdl3-build
          cmake --install sdl3-build

      - name: Generated data is reproducible
        run: tools/regen.sh --check

      - name: Formatting
        run: |
          python3 -m pip install --user clang-format==18.1.8
          tools/format.sh --check

      # The core is the slow part of the build and changes only when the
      # submodule moves: its objects are kept per pinned commit, and touched
      # after the restore so make trusts them over the fresh checkout.
      - name: Core commit
        id: core
        run: echo "sha=$(git rev-parse HEAD:external/dosbox-pure)" >> "$GITHUB_OUTPUT"

      - name: Cache the core's objects
        uses: actions/cache@v4
        with:
          path: external/dosbox-pure/build
          key: core-linux-${{ matrix.arch }}-${{ steps.core.outputs.sha }}-v1

      - name: Trust the cached objects
        run: |
          if [ -d external/dosbox-pure/build ]; then
            find external/dosbox-pure/build -type f -exec touch {} +
          fi

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDXM_WERROR=ON \
                -DCMAKE_PREFIX_PATH="$HOME/sdl3-install"
          cmake --build build -j$(nproc)

      - name: Unit tests
        run: ctest --test-dir build -L unit --output-on-failure

      - name: Verify
        run: |
          test -x build/dxm
          # The GL entry points past 1.1 are fetched at run time, so they must
          # NOT appear as undefined symbols - if they do, the loader is being
          # bypassed and the binary will not start on a stock driver.
          if nm -D --undefined-only build/dxm | grep -E " glUniform|glCreateShader|glBindVertexArray"; then
            echo "GL 3.x symbols are linked, not loaded"; exit 1
          fi
          nm -D --defined-only build/dosbox_pure_libretro.so | grep -q " retro_run$"
          echo "ok: GL loaded at run time; the core exports retro_run"

      # A tarball someone can unpack and run.  SDL3 travels with it, because
      # it is not in Ubuntu's archive yet and nobody should have to build it.
      # libGL and the C++ runtime are left to the system: they are on every
      # desktop Linux already, and libGL in particular MUST come from the
      # local driver.  The core goes beside the binary, with its licence.
      - name: Package
        run: |
          mkdir -p dist/dxm/lib
          cp build/dxm dist/dxm/
          cp build/dosbox_pure_libretro.so dist/dxm/
          cp external/dosbox-pure/LICENSE dist/dxm/LICENSE-dosbox-pure.txt
          ldd build/dxm | awk '{print $3}' \
            | grep "^$HOME/sdl3-install/" \
            | sort -u | while read -r so; do cp -L "$so" dist/dxm/lib/; done
          ls -la dist/dxm dist/dxm/lib
          # Prove it resolves from its own directory and not from the build
          # tree - which is the whole point, and is exactly what the artifact
          # got wrong before it was packaged this way.
          ( cd dist/dxm && ldd ./dxm > /tmp/deps.txt )
          if grep -q "not found" /tmp/deps.txt; then
            echo "unresolved after packaging:"; grep "not found" /tmp/deps.txt; exit 1
          fi
          grep SDL3 /tmp/deps.txt
          if ldd dist/dxm/dosbox_pure_libretro.so | grep "not found"; then
            echo "the core has unresolved libraries"; exit 1
          fi
          echo "built against glibc $(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')"
          # Optional desktop integration.  install.sh writes the .desktop
          # with an absolute Exec, because that is the only thing that works
          # once the folder can live anywhere - and it means nothing has to
          # touch PATH or the user's shell configuration.
          cp packaging/linux/install.sh dist/dxm/
          cp assets/icon-src.png dist/dxm/dxm.png
          tar -czf "dxm-linux-${{ matrix.arch }}.tar.gz" -C dist dxm

      - uses: actions/upload-artifact@v4
        with:
          name: dxm-linux-${{ matrix.arch }}
          path: dxm-linux-${{ matrix.arch }}.tar.gz

      # A release asset is downloaded directly, with none of the zip wrapper
      # GitHub puts around a CI artifact - so it is one unpack, not two.
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dxm-linux-${{ matrix.arch }}.tar.gz" --clobber
